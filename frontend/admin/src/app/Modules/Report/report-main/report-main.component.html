<div class="container">
  <div class="row mb-4">
    <div class="col-lg-6 col-md-6 mb-3">
      <div class="stat-card shadow-sm">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <div class="stat-number">{{reportUserCount}}</div>
            <div class="stat-label">Reported Users</div>
          </div>
          <div class="stat-icon text-primary">
            <i class="bi bi-users"></i>
          </div>
          <button (click)="switchActive('users')" class="btn btn-manage">View Reported Users</button>
        </div>
      </div>
    </div>
    <div class="col-lg-6 col-md-6 mb-3">
      <div class="stat-card shadow-sm">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <div class="stat-number">{{reportPostCount}}</div>
            <div class="stat-label">Reported Posts</div>
          </div>
          <div class="stat-icon text-warning">
            <i class="fas fa-clock"></i>
          </div>
          <button (click)="switchActive('posts')" class="btn btn-gear">View Reported Posts</button>
        </div>
      </div>
    </div>
  </div>

  @switch (active) {
    @case('users'){
        <app-user-main
            (sendUserCount)="getUserCount($event)"
        >
        </app-user-main>
    }

    @case('posts') {
        <app-post-main
        
        ></app-post-main>
    }
  }
</div>

<div class="container-fluid" style="font-family: 'Nunito', sans-serif;">
  <app-breadcrumbs [navs]="navs" [current]="current"></app-breadcrumbs>

  <div class="px-4 py-3">
    <h2>Edit Forum Post</h2>

    @if(topicForm){
        <form [formGroup]="topicForm" (submit)="savePost()">
            <div class="mb-3">
              <label for="title" class="form-label">Title</label>
              <input type="text" class="form-control" id="title" formControlName="title">
            </div>
          
            <div class="mb-3">
              <label for="content" class="form-label">Content</label>
              <textarea class="form-control" id="content" formControlName="content"></textarea>
            </div>
          
            <div class="mb-3">
              <label class="form-label">Attachment:</label>

              @if(!currentAttachment && !selectedFiles){
                <div class="file-upload-control d-flex align-items-center gap-3">
                    <label class="file-upload-btn btn btn-outline-secondary">
                      <i class="bi bi-paperclip"></i> Add Attachment
                      <input type="file" style="display: none;" (change)="onFileSelected($event)" accept="image/*">
                    </label>
                </div>
              }

              @if(currentAttachment){
                <div class="d-flex gap-3 flex-column">
                  <div class="d-flex gap-3 align-items-center">
                    <p class="mb-0">Current: {{ currentAttachment }}</p>
                    <button type="button" class="btn btn-sm btn-danger" (click)="removeAttachment()">Remove</button>
                  </div>
                  <div class="mt-2">
                    <img [src]="post.media_url" alt="Post attachment" class="img-fluid" style="max-width: 300px">
                  </div>
                </div>
              }

              @if(selectedFiles){
                @for(file of selectedFiles; track $index) {
                    <div class="d-flex gap-3 align-items-center">
                      <p class="mb-0">New file: {{ file.name }}</p>
                      <button type="button" class="btn btn-sm btn-danger" (click)="removeAttachment()">Cancel</button>
                    </div>
                }
              }
            </div>
          
            <div class="d-flex gap-2 mt-4">
              <button class="btn btn-outline-secondary" type="button" (click)="cancelEdit()">
                Cancel
              </button>
          
              <button class="btn btn-primary" type="submit" [disabled]="isSubmitting">
                {{ isSubmitting ? 'Saving...' : 'Save Changes' }}
              </button>
            </div>
          </form>
    }
  </div>
</div>
